name: release

# Builds main.js with Raindown at RAINDOWN_VERSION, a tag or commit, packed inside it, and checks it with the smoke test,
# on each push and pull request. A tag then attaches the plugin's files to a GitHub release, which Obsidian installs
# from. Obsidian needs the tag to be the manifest's version, like 0.2.0, without a v. This folder is the root of the
# plugin's own repo, where this runs.

on:
  push:
    branches: [main]
    tags: ['*']
    # bin/bump's version commit is built by its tag's run, as GitHub doesn't filter tags by paths.
    paths-ignore: [manifest.json, package.json, versions.json]
  pull_request:

jobs:
  release:
    # 24.04, which still has each Ruby patch release, unlike newer runners.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag is the manifest's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"

      - name: Read the Raindown it's built with
        id: raindown
        run: echo "ref=$(cat RAINDOWN_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: rainpour/raindown
          ref: ${{ steps.raindown.outputs.ref }}
          path: build/raindown
      # Raindown's .ruby-version, as the standard library files a write-back loads, which are packed, can differ
      # between patch releases.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: build/raindown
      # Without checkouts of its sibling gems, like lowkey, Raindown's Gemfile takes them from RubyGems.
      - name: Install Raindown's gems, and rbwasm's
        working-directory: build/raindown
        run: |
          bundle install
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/wasm/Gemfile" bundle install
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # Which compresses ruby.wasm's module into main.js.
      - name: Install zopfli
        run: sudo apt-get install -y zopfli
      # ruby.wasm's downloads, which bin/build names the versions of.
      - uses: actions/cache@v5
        with:
          path: build/runtime
          key: ruby-wasm-${{ hashFiles('bin/build') }}
      # The module scripts/ruby_wasm.rb builds, which takes a while, so only what it's built from builds it again.
      - uses: actions/cache@v5
        with:
          path: build/module
          key: ruby-wasm-module-${{ hashFiles('scripts/ruby_wasm.rb', 'wasm/Gemfile.lock') }}
      - name: Build main.js, and run the smoke test
        run: RAINDOWN_DIR=build/raindown WASMTIME="$(which wasmtime)" bin/build

      # Before the release, so one that can't be verified is never published.
      - uses: actions/attest@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
