name: release

# Builds main.js with Raindown at RAINDOWN_VERSION, a tag or commit, packed inside it, and checks it with the smoke test,
# on each push and pull request. A tag then attaches the plugin's files to a GitHub release, which Obsidian installs
# from. Obsidian needs the tag to be the manifest's version, like 0.2.0, without a v. This folder is the root of the
# plugin's own repo, where this runs.

on:
  push:
    branches: [main]
    tags: ['*']
    # bin/bump's version commit is built by its tag's run, as GitHub doesn't filter tags by paths.
    paths-ignore: [manifest.json, package.json, versions.json]
  pull_request:

jobs:
  release:
    # 24.04, which still has each Ruby patch release, unlike newer runners.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      # 26, which has JSPI, which the smoke test runs the module without Asyncify with.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check the tag is the manifest's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"

      - name: Read the Raindown it's built with
        id: raindown
        run: echo "ref=$(cat RAINDOWN_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: rainpour/raindown
          ref: ${{ steps.raindown.outputs.ref }}
          path: build/raindown
      # After Raindown, as the plugin edits Markdown with its editing.js.
      - run: npm test
        env:
          RAINDOWN_DIR: build/raindown
      # The plugin's .ruby-version, which is ruby.wasm's Ruby, as the standard library files a write-back loads, which
      # are packed from ruby.wasm's, differ between patch releases.
      - uses: ruby/setup-ruby@v1
      # Without checkouts of its sibling gems, like lowkey, Raindown's Gemfile takes them from RubyGems.
      - name: Install Raindown's gems, and rbwasm's
        working-directory: build/raindown
        run: |
          bundle install
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/wasm/Gemfile" bundle install
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # Which compresses ruby.wasm's module into main.js.
      - name: Install zopfli
        run: sudo apt-get install -y zopfli
      # ruby.wasm's downloads, and the wasi-sdk and Binaryen the module without Asyncify's built with, which bin/build
      # names the versions of.
      - uses: actions/cache@v5
        with:
          path: build/runtime
          key: ruby-wasm-${{ hashFiles('bin/build') }}
      # The modules scripts/ruby_wasm.rb builds, which takes a while, so only what they're built from builds them again.
      - uses: actions/cache@v5
        with:
          path: build/module
          key: ruby-wasm-module-${{ hashFiles('scripts/ruby_wasm.rb', 'wasm/Gemfile.lock', 'wasm/patches/**') }}
      - name: Build main.js, and run the smoke test
        run: RAINDOWN_DIR=build/raindown WASMTIME="$(which wasmtime)" bin/build

      # Before the release, so one that can't be verified is never published.
      - uses: actions/attest@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            build/components/main.js
            build/components/manifest.json
            build/components/styles.css
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
      # Components, the plugin for beginners, which bin/build builds into build/components, released from its own
      # repository, as Obsidian lists each plugin from one: its manifest and versions on its main branch, which Obsidian
      # reads its version from, then a release of the same version with its files. COMPONENTS_TOKEN, a secret, can write
      # to that repository. Without it, it's skipped, with a warning, as the plugin's released already.
      - name: Release Components
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Components wasn't released, as there's no COMPONENTS_TOKEN"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/rainpour/obsidian-components.git" build/obsidian-components
          cd build/obsidian-components
          cp ../components/manifest.json manifest.json
          node -e "const fs = require('fs'); const versions = require('./versions.json'); versions[process.argv[1]] = require('./manifest.json').minAppVersion; fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n')" "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json versions.json
          git diff --cached --quiet || git commit -m "$GITHUB_REF_NAME"
          git push origin main
          gh release create "$GITHUB_REF_NAME" --repo rainpour/obsidian-components ../components/main.js ../components/manifest.json ../components/styles.css \
            --title "$GITHUB_REF_NAME" --notes "Built with the Raindown plugin's release $GITHUB_REF_NAME, from rainpour/raindown-obsidian."
